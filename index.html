<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <!-- ========================= HEART ========================= -->
      <div class="bubble">
        <svg class="heart" viewBox="0 0 24 24" fill="none">
          <path
            d="M12 21s-7.5-4.9-10-9.3C.5 8.1 2.2 4.5 5.7 4c2-.3 3.7.6 4.7 2.1.4.6 1 .6 1.4 0C12.8 4.6 14.5 3.7 16.5 4c3.5.5 5.2 4.1 3.7 7.7C19.5 16.1 12 21 12 21z"
            fill="#e6483c"
            stroke="#b5271c"
            stroke-width="0.5"
          />
        </svg>
      </div>
      <!-- ========================= QUIZ SECTION ========================= -->
      <section id="quiz">
        <h1>Daily Quiz!</h1>
        <div class="top">
          <span id="counter"> Question 1 of 5 </span>
          <span id="score"> Score: 0 </span>
        </div>
        <div class="bar"><div id="progress"></div></div>
        <p class="question" id="question"></p>
        <div class="grid" id="options"></div>
        <button class="btn" id="next" disabled>Next question</button>
      </section>
      <!-- ========================= RESULT SECTION ========================= -->
      <section id="result" class="result hidden">
        <h2>Quiz finished 🎉</h2>
        <div class="score" id="finalScore"></div>
        <p id="message"></p>
        <button class="btn" id="restart">Try again</button>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
